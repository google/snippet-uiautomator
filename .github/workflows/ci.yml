name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned to ubuntu-24.04: actions/python-versions has no Python 3.8 or
        # 3.9 builds for newer Ubuntu images, so ubuntu-latest can't set them up.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@3542bca2639a428e1796aaa6a2ffef0c0f575566 # v3.1.4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install mobly pyink pytest pytest-cov
    - name: Lint with pyink
      run: |
        pyink --check $(git ls-files '*.py')
    - name: Test with pytest
      run: |
         pytest
